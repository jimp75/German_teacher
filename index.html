<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Crect width='64' height='64' rx='14'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23c)'%3E%3Crect width='64' height='22' fill='%23111'/%3E%3Crect y='21' width='64' height='22' fill='%23c8102e'/%3E%3Crect y='42' width='64' height='22' fill='%23f2b705'/%3E%3C/g%3E%3Ctext x='32' y='46' font-family='Arial,sans-serif' font-size='40' font-weight='800' text-anchor='middle' fill='white' stroke='%231c1b19' stroke-width='3' paint-order='stroke'%3ED%3C/text%3E%3C/svg%3E">
<title>Deutsch Lehrer – German Teacher</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--mut:#6b675f;--line:#e6e1d6;--acc:#c8102e;--gold:#f2b705;--ok:#1f9d55;--okbg:#e4f6ec;--bad:#c8102e;--badbg:#fdeaea;--blue:#1f4e9c;--soft:#efebe2}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1e1c;--ink:#f1ede4;--mut:#a39e92;--line:#34322e;--ok:#3ecf80;--okbg:#14301f;--bad:#ff6b6b;--badbg:#3a1a1a;--blue:#7fa8ee;--soft:#2a2825;--acc:#ff4d63}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
header .logo{font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
header .flag{width:22px;height:16px;border-radius:3px;background:linear-gradient(#111 0 33%,#c8102e 33% 66%,#f2b705 66%)}
#stats{display:flex;gap:12px;font-weight:700;font-size:14px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 28px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut);font-weight:600}
nav button span{font-size:20px;line-height:1.1}
nav button.on{color:var(--acc)}
h2{margin:6px 0 4px;font-size:22px}h3{margin:18px 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
p{margin:6px 0}small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.hero{background:linear-gradient(135deg,#1c1b19,#3a1d22);color:#fff;border-radius:18px;padding:18px;margin-bottom:6px}
.hero h2{margin:0 0 4px}.hero p{color:#e8e2d6;margin:0 0 12px}
.primary{background:var(--acc);color:#fff;border-radius:12px;padding:13px 18px;font-weight:700;width:100%;text-align:center}
.primary:disabled{opacity:.45}
.ghost{border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600;background:var(--card)}
.gold{background:var(--gold);color:#1c1b19}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
.lv{margin:20px 0 6px}
.node{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.node .ic{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.node.done .ic{background:var(--ok);color:#fff;font-weight:800}
.node.lock{opacity:.55}
.node .tx{flex:1;min-width:0}.node b{display:block}.node small{display:block}
.bar{display:block;height:6px;background:var(--soft);border-radius:4px;margin-top:6px;overflow:hidden}
.bar u,.prog u{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .3s}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.step .ic{font-size:26px;width:44px;text-align:center}
.step .tx{flex:1}.step b{display:block}.chk{color:var(--ok);font-weight:800}
.back{font-weight:700;color:var(--blue);padding:4px 0 8px;display:inline-block}
.ex{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border:0}.ex b{font-weight:700}.ex small{display:block}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--soft)}
.tip{background:var(--soft);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;margin:10px 0}
.spk{font-size:16px;padding:2px 6px;border-radius:8px;background:var(--soft)}
.vl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.vl div{padding:7px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog{flex:1;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.cnt{font-size:13px;color:var(--mut);font-weight:700}
.top .back{padding:0}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.qt{font-size:20px;font-weight:700;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
input[type=text],textarea,select{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input[type=text]{font-size:18px}
.chars{display:flex;gap:8px;margin:8px 0}.chars button{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;background:var(--card)}
.chip{display:inline-block;padding:9px 13px;border:1.5px solid var(--line);border-radius:12px;margin:4px 4px 4px 0;font-weight:600;background:var(--card)}
.slot{min-height:56px;border-bottom:2px solid var(--line);padding:6px 0;margin-bottom:10px}
.chip.used{opacity:.25;pointer-events:none}
.fb{margin-top:14px;padding:12px;border-radius:12px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.expl{white-space:pre-wrap;margin-top:8px}
.res{text-align:center}.big{font-size:64px;font-weight:800;color:var(--acc)}
.wr{text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.flash{min-height:220px;display:grid;place-items:center;text-align:center;font-size:30px;font-weight:800;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);width:100%}
.flash small{display:block;font-size:14px;font-weight:500;margin-top:8px}
main{position:relative}
.chat{display:flex;flex-direction:column;position:absolute;inset:0}
.opts{padding:10px 12px calc(10px);border-top:1px solid var(--line);background:var(--card);max-height:55%;overflow-y:auto}
.b small{display:block;opacity:.75;margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.chips .chip{white-space:nowrap;margin:0;padding:7px 11px;font-size:14px}.chips .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.msgs{flex:1;overflow-y:auto;padding:12px}
.b{max-width:88%;padding:10px 13px;border-radius:16px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.b.a{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.b.u{background:var(--acc);color:#fff;margin-left:auto;border-top-right-radius:4px}
.b .spk{margin-top:4px;display:inline-block}
.comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);align-items:flex-end}
.comp textarea{resize:none;flex:1}
.comp button{width:46px;height:46px;border-radius:50%;background:var(--soft);font-size:20px;flex:none}
.comp .send{background:var(--acc);color:#fff}.comp .rec{background:var(--gold)}
.bigmic{width:84px;height:84px;border-radius:50%;background:var(--acc);color:#fff;font-size:36px;margin:2px auto;display:block}
.bigmic.rec,.comp .micb.rec{background:var(--gold);color:#1c1b19}.bigmic.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0;text-align:center}.stats b{font-size:26px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;background:var(--card)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;display:none;max-width:90%;text-align:center}
.mut{color:var(--mut)}.okt{color:var(--ok);font-weight:700}
label.sw{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body>
<header><div class="logo"><span class="flag"></span>Deutsch Lehrer</div><div id="stats"></div></header>
<main id="main"></main>
<nav id="nav">
 <button data-a="tab" data-t="learn"><span>🗺️</span>Path</button>
 <button data-a="tab" data-t="talk"><span>💬</span>Talk</button>
 <button data-a="tab" data-t="practice"><span>🎯</span>Practice</button>
 <button data-a="tab" data-t="me"><span>👤</span>Me</button>
</nav>
<div id="toast"></div>
<script>
/* ============ CONTENT ============ */
const mc=(q,o,a,e)=>({t:'mc',q,o,a,e:e||''});
const fi=(q,a,e)=>({t:'fill',q,a:[].concat(a),e:e||''});
const od=(q,a,e)=>({t:'order',q,a,w:a.replace(/[.?!]$/,'').split(' '),e:e||''});

const U=[
{id:'u1',lv:'A1',ic:'👋',t:'Hallo! Greetings',s:'Say hello and introduce yourself',
notes:[
['h','Greeting people'],
['ex',[['Hallo! / Guten Tag!','Hello! / Good day!'],['Guten Morgen / Guten Abend','Good morning / good evening'],['Wie geht’s?','How are you?'],['Mir geht’s gut, danke.','I’m fine, thanks.'],['Tschüss! / Auf Wiedersehen!','Bye! / Goodbye (formal)']]],
['h','Introducing yourself'],
['ex',[['Ich heiße Anna.','My name is Anna.'],['Ich komme aus Frankreich.','I come from France.'],['Ich wohne in Lyon.','I live in Lyon.'],['Wie heißt du? / Wie heißen Sie?','What’s your name? (informal / formal)'],['Woher kommst du?','Where are you from?']]],
['h','The verb “sein” (to be)'],
['tbl',['','sein'],[['ich','bin'],['du','bist'],['er / sie / es','ist'],['wir','sind'],['ihr','seid'],['sie / Sie','sind']]],
['tip','du = friends, family, kids. Sie (capital S) = polite “you” for strangers and work.']],
v:[['Hallo','Hello'],['Guten Morgen','Good morning'],['Guten Tag','Good day'],['Guten Abend','Good evening'],['Tschüss','Bye'],['Auf Wiedersehen','Goodbye (formal)'],['Danke','Thank you'],['Bitte','Please / You’re welcome'],['Ja','Yes'],['Nein','No'],['Entschuldigung','Excuse me / Sorry'],['Wie geht’s?','How are you?']],
x:[mc('How do you say “Good morning”?',['Guten Morgen','Guten Abend','Gute Nacht','Tschüss'],0,'Morgen = morning, Abend = evening.'),
fi('Ich ___ Anna. (to be called)','heiße','heißen → ich heiße, du heißt.'),
fi('Ich ___ aus Frankreich. (to come)','komme','kommen → ich komme.'),
mc('Polite “you”: Wie heißen ___?',['du','Sie','ihr','wir'],1,'Sie (capital S) is the formal “you”.'),
fi('Ich ___ müde. (to be)','bin','sein → ich bin, du bist, er ist.'),
od('I live in Lyon.','Ich wohne in Lyon.','The verb comes in 2nd position.'),
fi('Woher ___ du? (to come)','kommst','With du the verb ends in -st.'),
mc('Du ___ nett. (sein)',['bin','bist','ist','sind'],1,'du bist.'),
mc('Which means “Thank you”?',['Bitte','Danke','Tschüss','Hallo'],1,'Danke = thanks. Bitte = please / you’re welcome.')]},

{id:'u2',lv:'A1',ic:'🔢',t:'Numbers & age',s:'Count, say your age, phone numbers',
notes:[
['h','Numbers 0–12 and 20'],
['p','null · eins · zwei · drei · vier · fünf · sechs · sieben · acht · neun · zehn · elf · zwölf · zwanzig'],
['h','Building numbers'],
['ex',[['13–19: unit + zehn','dreizehn, vierzehn, fünfzehn, achtzehn'],['Irregular: sechzehn, siebzehn','sechs → sech-, sieben → sieb-'],['Tens: -zig','zwanzig, dreißig, vierzig, fünfzig'],['21+: unit first!','einundzwanzig (one-and-twenty)']]],
['h','Age'],
['ex',[['Wie alt bist du?','How old are you?'],['Ich bin achtzehn Jahre alt.','I am eighteen years old.'],['Meine Tochter ist fünfzehn.','My daughter is fifteen.']]],
['tip','Phone numbers are read digit by digit: 0-1-7-2 → null eins sieben zwei.']],
v:[['null','0'],['eins','1'],['zwei','2'],['drei','3'],['vier','4'],['fünf','5'],['sechs','6'],['sieben','7'],['acht','8'],['neun','9'],['zehn','10'],['elf','11'],['zwölf','12'],['zwanzig','20']],
x:[mc('Which number is “sieben”?',['6','7','8','9'],1),
mc('What is 15 in German?',['fünfzehn','fünfzig','fünf','fünfte'],0,'fünf + zehn → fünfzehn. fünfzig is 50.'),
fi('Wie ___ bist du? (old)','alt','Wie alt bist du? = How old are you?'),
fi('Ich bin achtzehn Jahre ___.','alt'),
fi('drei + vier = ___','sieben'),
mc('How do you say 21?',['zwanzigeins','einundzwanzig','zwanzig und eins','eins und zwanzig'],1,'Units come first: ein-und-zwanzig.'),
od('I am twenty years old.','Ich bin zwanzig Jahre alt.'),
mc('What is 16?',['sechzig','sechzehn','sieben','sechs'],1,'sechzehn drops the “s” of sechs; sechzig = 60.'),
mc('“Wie alt bist du?” means…',['Where are you from?','How old are you?','What is your name?','How are you?'],1)]},

{id:'u3',lv:'A1',ic:'🏠',t:'Nouns & articles',s:'der, die, das and plurals',
notes:[
['h','Three genders'],
['tbl',['','the','a'],[['masculine','der Hund','ein Hund'],['feminine','die Katze','eine Katze'],['neuter','das Kind','ein Kind'],['plural','die Kinder','– (no article)']]],
['tip','Always learn the article with the noun: “der Tisch”, not just “Tisch”.'],
['h','Handy hints'],
['ex',[['-ung, -heit, -keit, -schaft → die','die Zeitung, die Freiheit'],['-chen, -lein → das','das Mädchen'],['Many nouns in -e → die','die Lampe, die Katze']]],
['h','Plurals (no single rule!)'],
['ex',[['-e','der Hund → die Hunde'],['-n / -en','die Katze → die Katzen'],['-er (+ umlaut)','das Buch → die Bücher'],['umlaut only','der Apfel → die Äpfel']]],
['p','All nouns are written with a capital letter in German.']],
v:[['der Mann','man'],['die Frau','woman'],['das Kind','child'],['der Tisch','table'],['die Lampe','lamp'],['das Buch','book'],['der Hund','dog'],['die Katze','cat'],['das Haus','house'],['die Schule','school'],['der Apfel','apple'],['die Stadt','city / town']],
x:[mc('___ Hund (the dog)',['der','die','das'],0),
mc('___ Katze (the cat)',['der','die','das'],1,'Most nouns ending in -e are feminine.'),
mc('___ Buch (the book)',['der','die','das'],2),
fi('Das ist ___ Haus. (a)','ein','Neuter → ein Haus.'),
fi('Das ist ___ Lampe. (a)','eine','Feminine → eine Lampe.'),
mc('Plural of “das Kind”',['die Kinds','die Kinder','die Kinden','die Kindern'],1),
mc('Plural of “die Katze”',['die Katzen','die Katzer','die Katze','die Katzes'],0),
mc('Nouns ending in -ung are usually…',['masculine','feminine','neuter'],1,'die Zeitung, die Wohnung.'),
od('That is a dog.','Das ist ein Hund.'),
mc('Plural of “das Buch”',['die Bücher','die Buchen','die Buchs','die Büche'],0,'Many neuter nouns: -er + umlaut.')]},

{id:'u4',lv:'A1',ic:'☕',t:'Food & drink',s:'Order in a café',
notes:[
['h','Ordering'],
['ex',[['Ich möchte einen Kaffee, bitte.','I would like a coffee, please.'],['Die Rechnung, bitte.','The bill, please.'],['Das ist lecker!','That’s delicious!'],['Ich esse Brot und trinke Wasser.','I eat bread and drink water.']]],
['h','Three useful verbs'],
['tbl',['','essen','trinken','möchten'],[['ich','esse','trinke','möchte'],['du','isst','trinkst','möchtest'],['er/sie/es','isst','trinkt','möchte'],['wir','essen','trinken','möchten'],['ihr','esst','trinkt','möchtet'],['sie/Sie','essen','trinken','möchten']]],
['h','Accusative (the thing you eat/drink/order)'],
['p','Only masculine changes: der Tee → <b>einen</b> Tee, <b>den</b> Tee. Feminine and neuter stay the same: eine Milch, ein Brot.']],
v:[['das Wasser','water'],['der Kaffee','coffee'],['der Tee','tea'],['die Milch','milk'],['das Brot','bread'],['der Käse','cheese'],['der Wein','wine'],['das Frühstück','breakfast'],['das Abendessen','dinner'],['essen','to eat'],['trinken','to drink'],['ich möchte','I would like'],['lecker','delicious'],['die Rechnung','the bill']],
x:[fi('Ich ___ einen Kaffee. (would like)','möchte','möchte = would like.'),
fi('Er ___ Brot. (essen)','isst','essen is irregular: du isst, er isst.'),
fi('Du ___ Milch. (trinken)','trinkst'),
mc('Ich möchte ___ Tee. (der Tee)',['ein','eine','einen','einem'],2,'Masculine accusative: ein → einen.'),
mc('“The bill, please” =',['Die Rechnung, bitte','Das Wasser, bitte','Der Kaffee, danke','Ich trinke'],0),
od('I would like a coffee, please.','Ich möchte bitte einen Kaffee.'),
mc('“lecker” means…',['delicious','expensive','hot','cold'],0),
fi('Wir ___ Käse. (essen)','essen','wir → same as the infinitive.')]},

{id:'u5',lv:'A1',ic:'🧩',t:'Verbs & word order',s:'Present tense, questions, negation',
notes:[
['h','Regular verbs: stem + ending'],
['tbl',['','machen','arbeiten','haben'],[['ich','mache','arbeite','habe'],['du','machst','arbeitest','hast'],['er/sie/es','macht','arbeitet','hat'],['wir','machen','arbeiten','haben'],['ihr','macht','arbeitet','habt'],['sie/Sie','machen','arbeiten','haben']]],
['tip','Stems ending in -t/-d add an extra “e”: du arbeitest, er arbeitet.'],
['h','Word order'],
['ex',[['Ich lerne heute Deutsch.','Verb in 2nd position'],['Heute lerne ich Deutsch.','Time first → verb still 2nd, subject after'],['Wohnst du in Paris?','Yes/no question: verb first'],['Wo wohnst du?','W-question: W-word, then verb']]],
['h','Negation'],
['ex',[['Ich komme nicht aus Spanien.','nicht = not (verbs, adjectives)'],['Ich habe keinen Hund.','kein = no/not a (nouns)']]]],
v:[['machen','to do / make'],['wohnen','to live'],['arbeiten','to work'],['lernen','to learn'],['spielen','to play'],['kommen','to come'],['gehen','to go'],['haben','to have'],['heute','today'],['morgen','tomorrow'],['immer','always'],['oft','often'],['nicht','not'],['auch','also']],
x:[fi('Wir ___ in Lyon. (wohnen)','wohnen'),
fi('Du ___ viel. (arbeiten)','arbeitest','Stem ends in -t → extra “e”.'),
fi('Er ___ einen Hund. (haben)','hat','haben: er hat.'),
mc('Heute ___ ich Deutsch.',['lerne','lernst','lernen','lernt'],0,'Verb stays in 2nd position, subject follows.'),
od('Today I am learning German.','Heute lerne ich Deutsch.'),
od('Do you live in Paris?','Wohnst du in Paris?','Yes/no questions start with the verb.'),
mc('Ich komme ___ aus Deutschland.',['kein','nicht','keine','nichts'],1,'nicht negates the verb/phrase.'),
fi('Ihr ___ gut. (spielen)','spielt','ihr → -t.'),
mc('Ich habe ___ Hund. (no)',['nicht','kein','keinen','keine'],2,'Masculine accusative: keinen.')]},

{id:'u6',lv:'A1',ic:'👨‍👩‍👧',t:'Family & time',s:'Talk about family, tell the time',
notes:[
['h','Possessives'],
['tbl',['','der / das','die / plural'],[['my','mein Vater, mein Kind','meine Mutter, meine Eltern'],['your (du)','dein Vater','deine Mutter'],['his','sein Bruder','seine Schwester']]],
['h','Telling the time'],
['ex',[['Wie spät ist es?','What time is it?'],['Es ist drei Uhr.','It’s 3 o’clock.'],['Es ist halb vier.','3:30 (half TO four!)'],['Viertel nach drei / Viertel vor vier','3:15 / 3:45']]],
['h','Days'],
['p','Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag → “am Montag” = on Monday.']],
v:[['die Familie','family'],['die Mutter','mother'],['der Vater','father'],['der Sohn','son'],['die Tochter','daughter'],['der Bruder','brother'],['die Schwester','sister'],['die Eltern','parents'],['die Uhr','clock / o’clock'],['das Wochenende','weekend'],['die Stunde','hour'],['früh','early'],['spät','late']],
x:[fi('Das ist ___ Mutter. (my)','meine','Feminine → meine.'),
fi('Das ist ___ Vater. (my)','mein'),
mc('“halb vier” is…',['3:30','4:30','3:45','4:15'],0,'halb vier = half way to four = 3:30.'),

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[.,!?;:"“”’']/g,'').replace(/\s+/g,' ').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
let cloud=null,saveT=null;
function save(){S.ts=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 clearTimeout(saveT);saveT=setTimeout(()=>{if(cloud){try{Promise.resolve(cloud.set(JSON.parse(JSON.stringify(S)))).catch(()=>{})}catch(e){}}},1500)}
const today=()=>new Date().toISOString().slice(0,10);
function touch(){const t=today();if(S.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=t}

(async()=>{try{const [db,user]=await Promise.all([tryUse('db'),tryUse('user')]);if(!db||!user)return;const id=await user.id();const d=db.collection('data/users/'+id).doc('progress');const snap=await d.get();

/* voice: the browser's own speech engine (free, offline) */
let VOICE=null;
function pickVoice(){try{VOICE=speechSynthesis.getVoices().find(x=>/^de(-|_|$)/i.test(x.lang))||null}catch(e){}}
try{if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function say(t,cb){t=String(t).split('\n').filter(l=>!/^\s*[✏✅\u{1F4A1}\u{1F4DD}]/u.test(l)).join(' ').replace(/\([^)]*\)/g,'').replace(/️/g,'').trim();
 if(!t){cb&&cb();return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(VOICE)u.voice=VOICE;u.rate=.9;
  if(cb){let done=false;const f=()=>{if(!done){done=true;cb()}};u.onend=f;u.onerror=f;setTimeout(f,Math.max(6000,t.length*120))}
  speechSynthesis.speak(u)}catch(e){cb&&cb()}}
const canSay=()=>{try{return 'speechSynthesis' in window}catch(e){return false}};

let DICT=null,SRC=window.SpeechRecognition||window.webkitSpeechRecognition,SRBAD=false,LCB=null,LISTEN=false,REC=null;
(async()=>{DICT=await tryUse('dictation');if(DICT){try{DICT.onFinal(({text})=>{if(LCB&&text)LCB(text)});DICT.onState(({state})=>{LISTEN=state==='listening';micUI()})}catch(e){}}

function stopListen(){try{if(REC)REC.stop();else if(DICT&&LISTEN)DICT.stop()}catch(e){}}
function listen(cb){
 if(LISTEN){stopListen();return}
 LCB=cb;
 if(useSR()){try{REC=new SRC();REC.lang='de-DE';REC.interimResults=false;
   REC.onresult=e=>{const t=e.results[0][0].transcript;if(LCB)LCB(t)};
   REC.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){SRBAD=true;toast(DICT?'Mic blocked here. Tap 🎤 again to use the Claude mic.':'Microphone not available in this view. Open the standalone file in Chrome or Safari.');render()}};
   REC.onend=()=>{REC=null;LISTEN=false;micUI()};
   REC.start();LISTEN=true;micUI()}catch(e){REC=null;SRBAD=true;toast('Speech input failed. Tap 🎤 to try again.')}}
 else if(DICT){try{DICT.start().catch(()=>{})}catch(e){}}
 else toast('No microphone input available here.')}
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;const m=a.length,n=b.length;let d=[];for(let j=0;j<=n;j++)d[j]=j;
 for(let i=1;i<=m;i++){let p=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return 1-d[n]/Math.max(m,n)}

function vocabQ(w,pool){const dir=Math.random()<.5;const others=shuffle(pool.filter(x=>x[0]!==w[0])).slice(0,3);const opts=shuffle([w,...others]);
 return dir?{t:'mc',q:`What does “${w[0]}” mean?`,say:w[0],o:opts.map(x=>x[1]),a:opts.indexOf(w),w:w[0],e:`${w[0]} = ${w[1]}`}
 :{t:'mc',q:`How do you say “${w[1]}” in German?`,o:opts.map(x=>x[0]),a:opts.indexOf(w),w:w[0],e:`${w[1]} = ${w[0]}`}}

function makeMix(us,nV,nE,pref){const pool=us.flatMap(u=>u.v);let ws=shuffle(pool);
 if(pref){const m=pool.filter(w=>S.miss[w[0]]);ws=[...shuffle(m),...ws.filter(w=>!S.miss[w[0]])]}
 const vq=ws.slice(0,nV).map(w=>vocabQ(w,pool));const eq=shuffle(us.flatMap(u=>u.x)).slice(0,nE).map(x=>({...x}));return shuffle([...vq,...eq])}
function weakQs(){const pool=ALLU().flatMap(u=>u.v);return shuffle(pool.filter(w=>S.miss[w[0]])).slice(0,10).map(w=>vocabQ(w,pool))}

  h+=`<div class="qt">${sentence}</div><input type="text" id="fi" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Your answer" ${a?`disabled value="${esc(a.given)}"`:''}>`;

 if(q.t==='order'){h+=`<div class="qt">Translate: ${esc(q.q)}</div><div class="slot">${s.cur.sel.map(k=>`<button class="chip" data-a="unpick" data-k="${k}">${esc(q.w[0]&&s.cur.bank.find(b=>b.i===k).x)}</button>`).join('')}</div><div>${s.cur.bank.map(b=>`<button class="chip ${s.cur.sel.includes(b.i)||a?'used':''}" data-a="word" data-k="${b.i}">${esc(b.x)}</button>`).join('')}</div>${a?'':`<button class="primary" style="margin-top:12px" data-a="check" ${s.cur.sel.length?'':'disabled'}>Check</button>`}`}
 if(a){const ans=q.t==='mc'?q.o[q.a]:q.t==='fill'?q.a[0]:q.a;const last=s.i===s.qs.length-1;
  h+=`<div class="fb ${a.ok?'ok':'bad'}"><b>${a.ok?'✅ Richtig!':'❌ Not quite'}</b>${a.ok?'':`<div>Correct: <b>${esc(ans)}</b></div>`}${q.e?`<div>${esc(q.e)}</div>`:''}${q.t!=='mc'?`<div>${spk(q.t==='fill'?q.q.replace('___',q.a[0]).replace(/\s*\([^)]*\)/,''):q.a)}</div>`:''}<div id="expl" class="expl">${esc(s.expl)}</div>

 return h+'</div></div>'}

 const bub=D.hist.map(m=>m.r==='a'?`<div class="b a">${esc(m.de)}${canSay()?`<br><button class="spk" data-a="say" data-t="${esc(m.de)}">🔊</button>`:''}${S.tr!==false?`<small>${esc(m.en)}</small>`:''}</div>`:`<div class="b u">${esc(m.de)}${m.en?`<small>${esc(m.en)}</small>`:''}</div>`).join('');

  if(S.speak&&hasSTT())panel=`<div style="text-align:center"><button class="bigmic micb ${LISTEN?'rec':''}" data-a="dmic" aria-label="Speak">🎤</button><p class="mut" style="margin:6px 0">${LISTEN?'Listening… tap to stop':'Tap and say your reply in German'}</p>${D.heard?`<p style="margin:4px 0">I heard: <b>“${esc(D.heard)}”</b></p>`:''}${fb}${D.show?`<div style="text-align:left">${opts}</div>`:`<button class="ghost" data-a="dshow">💡 Show choices</button>`}</div>`;
  else panel=fb+(fb?'':'<p class="mut" style="margin:0 0 6px">Your reply:</p>')+opts}

/* ---- optional AI teacher ---- */
const LANGS2={en:'English',fr:'French',pt:'Portuguese',es:'Spanish'};
const SCN=[
{id:'free',l:'💬 Free chat',p:'Have a relaxed free conversation about everyday topics. Begin by greeting the student and asking one simple question.'},
{id:'cafe',l:'☕ Café',p:'Roleplay: you are a waiter in a café in Berlin and the student is the customer. Begin by welcoming them.'},
{id:'work',l:'💼 At work',p:'Roleplay: you are a colleague chatting with the student about work and the weekend.'},
{id:'trip',l:'✈️ Travel',p:'Roleplay: you are a hotel receptionist in Vienna; the student arrives to check in. Begin by welcoming them.'},
{id:'fix',l:'✏️ Fix my text',p:''}];
function speakCard(){if(!canSay())return '';
 if(!hasSTT())return `<div class="card mut"><b>🎤 Speak mode</b><br>Needs microphone access. Open the standalone file in Chrome or Safari (or use the Claude app) to answer by voice.</div>`;
 return `<div class="card"><b>🎤 Speak mode</b><p class="mut">The partner speaks, you answer out loud in German. Choices stay hidden until you ask.</p><div class="seg"><button class="${S.speak?'on':''}" data-a="spk">Speak mode: ${S.speak?'on':'off'}</button>${useSR()?`<button class="${S.hands?'on':''}" data-a="hands">Hands-free: ${S.hands?'on':'off'}</button>`:''}</div></div>`}
function aiCard(){
 if(!SAMPLE)return '';
 if(!S.ai)return `<div class="card"><b>🤖 AI teacher (optional)</b><p class="mut">Free conversation with corrections. It uses Claude and consumes tokens, so it is off by default.</p><button class="ghost" data-a="aion">Enable in this app</button></div>`;
 return `<h3>🤖 AI teacher · uses Claude tokens</h3>`+SCN.map(s=>`<button class="card step" data-a="scn" data-id="${s.id}"><span class="tx"><b>${s.l}</b></span></button>`).join('')+`<h3>Scripted conversations (free)</h3>`}
function vChat(){const c=UI.chat;
 return `<div class="chat"><div class="chips"><button class="chip" data-a="chatback">← All</button>${canSay()&&hasSTT()?`<button class="chip ${S.voice?'on':''}" data-a="voice">🎙️ Voice: ${S.voice?'on':'off'}</button>`:''}${SCN.map(s=>`<button class="chip ${s.id===c.scn?'on':''}" data-a="scn" data-id="${s.id}">${s.l}</button>`).join('')}</div><div class="msgs" id="msgs"></div>
 <div class="comp">${hasSTT()?`<button class="micb ${LISTEN?'rec':''}" data-a="mic" aria-label="Speak">🎤</button>`:''}<textarea id="ci" rows="2" placeholder="${c.scn==='fix'?'Paste your German text…':'Schreib auf Deutsch…'}"></textarea><button class="send" data-a="send" aria-label="Send">➤</button></div></div>`}
function paintChat(){const el=$('#msgs'),c=UI.chat;if(!el||!c)return;
 el.innerHTML=c.hist.map(m=>`<div class="b ${m.role==='user'?'u':'a'}">${esc(m.content||'…')}${m.role==='assistant'&&m.content&&canSay()?`<br><button class="spk" data-a="say" data-t="${esc(m.content)}">🔊</button>`:''}</div>`).join('')+(c.err?`<div class="b a mut">⚠️ ${esc(c.err)}</div>`:'');
 el.scrollTop=el.scrollHeight}
function instr(){const c=UI.chat,sc=SCN.find(s=>s.id===c.scn),L=LANGS2[S.lang]||'English';
 if(sc.id==='fix')return `You are Lena, a kind German teacher. Student level: ${S.lvl}. The student's language: ${L}. The student sends German text. Reply in ${L} (keep German examples in German) with exactly this structure:\n✅ Corrected: <corrected German text>\n📝 Mistakes: up to 5 bullets "wrong → right: short reason"\n💡 Tip: one short tip.\nIf there are no mistakes, say so. If the text is not German, ask the student to write in German. Be concise. Plain text, no markdown.`;
 return `You are Lena, a friendly, patient German teacher. Student level: ${S.lvl}. The student's language for explanations: ${L}. Scenario: ${sc.p}\nRules: reply mainly in simple German suited to ${S.lvl}; at most 3 short sentences; end with one easy question. If the student's last message has German mistakes, begin with a line "✏️ <corrected sentence>", then a line "💡 <short explanation in ${L}>", then continue in German on new lines. Only the German conversation lines (not ✏️ or 💡 lines) are read aloud, so keep them short and natural. Add short glosses in ${L} in parentheses for hard words. If the student writes in another language, show how to say it in German. Plain text only, no markdown.`}
async function ask(){const c=UI.chat;c.err='';const msgs=[{role:'user',content:instr()+'\n\nStart the session now with your first message.'},...c.hist.filter(m=>m.content)];
 const mine=c.hist.push({role:'assistant',content:''})-1;paintChat();
 try{const r=await SAMPLE(msgs,{cache:false,onText:({text})=>{if(UI.chat===c){c.hist[mine].content=text;paintChat()}}});c.hist[mine].content=r.text;voiceReply(c,r.text)}
 catch(e){c.hist.splice(mine,1);c.err=e&&e.code==='rate_limited'?'Too many requests — wait a moment.':e&&e.code==='not_granted'?'AI access was declined.':'Could not reach the AI. Try again.'}
 if(UI.chat===c){c.busy=false;paintChat()}}
function startChat(id){if(!SAMPLE||!S.ai)return;UI.chat={scn:id,hist:[],busy:true,err:''};
 if(id==='fix'){UI.chat.hist.push({role:'assistant',content:'Schick mir einen deutschen Text – ich korrigiere ihn.\n(Send me a German text and I will correct it.)'});UI.chat.busy=false;render()}
 else{render();ask()}}
function sendChat(){const c=UI.chat,ci=$('#ci');if(!c||c.busy||!ci)return;const t=ci.value.trim();if(!t)return;ci.value='';c.hist.push({role:'user',content:t});c.busy=true;paintChat();ask()}
function voiceReply(c,text){if(!S.voice||!canSay())return;say(text,()=>{if(UI.chat===c&&S.voice&&useSR()&&!LISTEN)listen(chatHeard)})}
function chatHeard(t){LCB=null;try{if(DICT&&LISTEN&&!REC)DICT.stop()}catch(e){}const ci=$('#ci');if(ci){ci.value+=(ci.value?' ':'')+t;if(S.voice)sendChat()}}
function dlgAdv(){const D=UI.dlg;const said=[];while(D.i<D.d.steps.length&&D.d.steps[D.i].t==='n'){const s=D.d.steps[D.i++];D.hist.push({r:'a',de:s.de,en:s.en||''});said.push(s.de)}
 if(D.i>=D.d.steps.length){const pct=D.total?Math.round(D.score/D.total*100):100,xp=D.score*10;S.xp+=xp;touch();S.dlg[D.d.id]=Math.max(S.dlg[D.d.id]||0,pct);save();D.done=true;D.res={pct,xp};return}
 D.opts=shuffle(D.d.steps[D.i].o.map((o,k)=>({...o,k})));D.fb='';D.bad={};D.miss=false;D.show=!(S.speak&&hasSTT());D.tries=0;D.heard='';
 if(S.speak&&canSay()&&said.length)say(said.join(' '),()=>{if(S.hands&&useSR()&&UI.dlg===D&&!D.done&&!LISTEN)listen(heardDlg)})}
function heardDlg(t){const D=UI.dlg;if(!D||D.done||!D.d.steps[D.i]||D.d.steps[D.i].t!=='y')return;LCB=null;try{if(DICT&&LISTEN&&!REC)DICT.stop()}catch(e){}
 const st=D.d.steps[D.i];let best=-1,bs=0;st.o.forEach((o,k)=>{const s=sim(t,o.de);if(s>bs){bs=s;best=k}});D.heard=t;
 if(best>=0&&bs>=0.75){ACT.dpick({k:String(best)});return}
 D.tries=(D.tries||0)+1;D.fb='I heard it differently. Try again.';if(D.tries>=2)D.show=true;render();
 if(S.hands&&useSR())setTimeout(()=>{if(UI.dlg===D&&!D.done&&!LISTEN)listen(heardDlg)},700)}
function startDlg(id){const d=ALLD().find(x=>x.id===id);if(!d)return;UI.dlg={d,i:0,hist:[],score:0,total:d.steps.filter(s=>s.t==='y').length,done:false,opts:[],fb:'',bad:{},miss:false};dlgAdv();render()}

/* ============ ACTIONS ============ */
function checkAnswer(){const s=UI.sess,q=s.qs[s.i];let ok,given;
 if(q.t==='fill'){given=($('#fi').value||'').trim();if(!given)return;ok=q.a.some(x=>norm(x)===norm(given))}
 else{given=s.cur.sel.map(k=>s.cur.bank.find(b=>b.i===k).x).join(' ');ok=norm(given)===norm(q.a)}
 record(ok,given)}
function record(ok,given,pick){const s=UI.sess,q=s.qs[s.i];s.ans={ok,given,pick};s.expl='';if(ok)s.score++;else s.wrong.push(q);
 if(q.w){if(ok){if(S.miss[q.w]){S.miss[q.w]--;if(!S.miss[q.w])delete S.miss[q.w]}S.known[q.w]=1}else S.miss[q.w]=(S.miss[q.w]||0)+1}
 save();render()}
function finishSession(){const s=UI.sess;const pct=Math.round(s.score/s.qs.length*100);const xp=s.score*10+(pct===100?10:0);S.xp+=xp;touch();
 if(s.unit){const u=su(s.unit);if(s.kind==='test')u.test=Math.max(u.test||0,pct);if(s.kind==='practice')u.practice=1}
 save();s.res={pct,xp};go('result',{replace:true})}
/* ============ CONTENT PACKS ============ */
const slug=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30);
const str=(x,n)=>String(x==null?'':x).slice(0,n||300);
function normEx(x){try{
 if(x.t==='mc'&&Array.isArray(x.o)&&x.o.length>=2&&Number.isInteger(x.a)&&x.o[x.a]!=null)return mc(str(x.q),x.o.map(o=>str(o,120)),x.a,str(x.e));
 if(x.t==='fill'&&x.q&&String(x.q).includes('___')&&x.a)return fi(str(x.q),[].concat(x.a).map(a=>str(a,80)),str(x.e));
 if(x.t==='order'&&x.a&&x.q)return od(str(x.q),str(x.a),str(x.e));}catch(e){}return null}
function normNotes(n){return (Array.isArray(n)?n:[]).map(b=>{try{
 if(['h','p','tip'].includes(b[0]))return [b[0],str(b[1],800)];
 if(b[0]==='ex')return ['ex',b[1].map(r=>[str(r[0],160),str(r[1],160)])];
 if(b[0]==='tbl')return ['tbl',b[1].map(c=>str(c,60)),b[2].map(r=>r.map(c=>str(c,60)))];}catch(e){}return null}).filter(Boolean)}
function normUnit(u,pid,i){if(!u||!u.t)return null;
 const v=(Array.isArray(u.v)?u.v:[]).filter(w=>Array.isArray(w)&&w[0]&&w[1]).map(w=>[str(w[0],80),str(w[1],80)]);
 const x=(Array.isArray(u.x)?u.x:[]).map(normEx).filter(Boolean);
 if(!v.length&&!x.length)return null;
 return {id:pid+':'+(slug(u.id)||'u'+(i+1)),lv:str(u.lv||'A1',3),ic:str(u.ic||'📘',4),t:str(u.t,60),s:str(u.s,100),notes:normNotes(u.notes),v,x}}
function normDlg(d,pid,i){if(!d||!d.t||!Array.isArray(d.steps))return null;
 const steps=d.steps.map(s=>{if(s&&s.t==='n'&&s.de)return {t:'n',de:str(s.de),en:str(s.en)};
  if(s&&s.t==='y'&&Array.isArray(s.o)){const o=s.o.filter(q=>q&&q.de).map(q=>({de:str(q.de),en:str(q.en),ok:q.ok?1:0,f:str(q.f)}));if(o.length>=2&&o.filter(q=>q.ok).length===1)return {t:'y',o}}return null}).filter(Boolean);
 if(!steps.some(s=>s.t==='y'))return null;
 return {id:pid+':'+(slug(d.id)||'d'+(i+1)),lv:str(d.lv||'A1',3),ic:str(d.ic||'💬',4),t:str(d.t,60),steps}}
function importPack(txt){let o;try{o=JSON.parse(txt)}catch(e){return {err:'This is not valid JSON. Paste the whole pack text.'}}
 if(o&&typeof o==='object'&&o.xp!==undefined&&o.u){Object.assign(S,o);save();return {ok:'Progress restored.'}}
 if(!o||(!Array.isArray(o.units)&&!Array.isArray(o.dialogues)))return {err:'No “units” or “dialogues” found in this text.'};
 const id=slug(o.id)||'pack'+Date.now().toString(36);
 const units=(o.units||[]).map((u,i)=>normUnit(u,id,i)).filter(Boolean),dialogues=(o.dialogues||[]).map((d,i)=>normDlg(d,id,i)).filter(Boolean);
 if(!units.length&&!dialogues.length)return {err:'Nothing valid found. Check the template for the format.'};
 const name=str(o.name||id,40);S.packs[id]={id,name,units,dialogues};save();
 return {ok:`Imported “${name}”: ${units.length} units, ${dialogues.length} conversations.`}}
const TEMPLATE=JSON.stringify({id:'my-pack',name:'My pack',units:[{id:'u1',lv:'A2',ic:'✈️',t:'Travel',s:'Airport words',notes:[['h','Title'],['p','Explanation. <b>Bold</b> allowed.'],['ex',[['Ich fahre nach Berlin.','I go to Berlin.']]],['tbl',['','col'],[['row','cell']]],['tip','A tip']],v:[['der Zug','train'],['der Flughafen','airport'],['die Fahrkarte','ticket'],['das Gleis','platform']],x:[{t:'mc',q:'Question in English?',o:['a','b','c','d'],a:0,e:'Why'},{t:'fill',q:'Ich ___ müde. (to be)',a:['bin'],e:'sein'},{t:'order',q:'I live in Lyon.',a:'Ich wohne in Lyon.',e:'Verb 2nd'}]}],dialogues:[{id:'d1',lv:'A2',ic:'🏨',t:'Hotel',steps:[{t:'n',de:'Guten Tag!',en:'Hello!'},{t:'y',o:[{de:'Guten Tag!',en:'Hello!',ok:1},{de:'Gute Nacht!',en:'',ok:0,f:'Hint shown when wrong'}]}]}]},null,1);
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Copied')}catch(e){const a=$('#ptxt');if(a){a.value=t;a.focus();a.select()}toast('Copy it from the box')}}
document.addEventListener('change',e=>{if(e.target.id!=='pfile'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const res=importPack(String(r.result));UI.pmsg=res.err||res.ok;render()};r.readAsText(e.target.files[0])});

const ACT={
 tab(d){UI.tab=d.t;UI.screen='home';UI.stack=[];render()},
 back(){back()},
 unit(d){const i=U.findIndex(u=>u.id===d.id);if(i>=0&&!isOpen(i)){toast('Pass the test of the previous unit (70%) to unlock this one.');return}go('unit',{unit:d.id})},
 lesson(){const u=su(UI.unit);u.lesson=1;save();go('lesson')},
 cards(){const u=unitById(UI.unit);if(UI.screen==='lesson'){UI.stack.pop()}openDeck(u.v,u.id)},
 practice(){const u=unitById(UI.unit);startSession({title:u.t,kind:'practice',unit:u.id,make:()=>shuffle(u.x).map(x=>({...x}))})},
 test(){const u=unitById(UI.unit);startSession({title:u.t,kind:'test',unit:u.id,pass:70,make:()=>makeMix([u],3,7)})},
 daily(){startSession({title:'Daily quiz',kind:'daily',make:()=>makeMix(unlocked(),4,6,true)})},
 weak(){const q=weakQs();if(!q.length){toast('No weak words yet — keep practising!');return}const pool=U.flatMap(u=>u.v);startSession({title:'Weak words',kind:'weak',make:()=>weakQs()})},
 say(d){say(d.t)},
 flip(){UI.deck.flip=!UI.deck.flip;render()},
 got(){const d=UI.deck,w=d.words.shift();S.known[w[0]]=1;if(S.miss[w[0]]){delete S.miss[w[0]]}d.done++;d.xp+=2;S.xp+=2;d.flip=false;if(!d.words.length){if(d.unit)su(d.unit).cards=1;touch()}save();render()},
 again(){const d=UI.deck,w=d.words.shift();S.miss[w[0]]=(S.miss[w[0]]||0)+1;d.words.push(w);d.flip=false;save();render()},
 pick(d){const s=UI.sess;if(s.ans)return;const k=+d.k;record(k===s.qs[s.i].a,s.qs[s.i].o[k],k)},
 word(d){const s=UI.sess;if(s.ans)return;if(!s.cur.sel.includes(+d.k))s.cur.sel.push(+d.k);render()},
 unpick(d){const s=UI.sess;if(s.ans)return;s.cur.sel=s.cur.sel.filter(k=>k!==+d.k);render()},
 ch(d){const i=$('#fi');if(!i)return;const p=i.selectionStart||i.value.length;i.value=i.value.slice(0,p)+d.c+i.value.slice(i.selectionEnd||p);i.focus();i.setSelectionRange(p+1,p+1)},
 check(){checkAnswer()},
 next(){const s=UI.sess;s.ans=null;s.i++;if(s.i>=s.qs.length)finishSession();else render()},
 retry(){const s=UI.sess;startSession({title:s.title,kind:s.kind,unit:s.unit,pass:s.pass,make:s.make})},
 aion(){S.ai=!S.ai;if(!S.ai)UI.chat=null;save();render()},
 scn(d){startChat(d.id)},
 send(){sendChat()},
 mic(){listen(chatHeard)},
 spk(){S.speak=!S.speak;if(!S.speak)S.hands=false;save();render()},
 hands(){S.hands=!S.hands;if(S.hands)S.speak=true;save();render()},
 voice(){S.voice=!S.voice;save();render()},
 dmic(){listen(heardDlg)},
 dshow(){UI.dlg.show=true;render()},
 chatback(){UI.chat=null;render()},
 dlg(d){startDlg(d.id)},
 dpick(d){const D=UI.dlg,st=D.d.steps[D.i],o=st.o[+d.k];if(o.ok){if(!D.miss)D.score++;D.hist.push({r:'u',de:o.de,en:o.en});D.i++;dlgAdv()}else{D.miss=true;D.bad[d.k]=1;D.fb=o.f||'Not quite — try another reply.'}render()},
 dback(){UI.dlg=null;render()},
 dretry(){startDlg(UI.dlg.d.id)},
 trtoggle(){S.tr=S.tr===false;save();render()},
 weakcards(){const w=U.concat(packUnits()).flatMap(u=>u.v).filter(w=>S.miss[w[0]]);if(!w.length){toast('No weak words yet');return}openDeck(w,null)},
 randcards(){openDeck(shuffle(unlocked().flatMap(u=>u.v)).slice(0,20),null)},
 pimport(){const t=($('#ptxt').value||'').trim();if(!t){UI.pmsg='Paste a pack first.';render();return}const r=importPack(t);UI.pmsg=r.err||r.ok;render()},
 ptemplate(){copyText(TEMPLATE,'Template copied')},
 pbackup(){copyText(JSON.stringify(S),'Backup copied — paste it into Import to restore')},
 prem(d){if(UI.rp!==d.id){UI.rp=d.id;render();setTimeout(()=>{UI.rp=null;if(UI.tab==='me'&&UI.screen==='home')render()},4000);return}delete S.packs[d.id];UI.rp=null;save();render();toast('Pack removed')},
 set(d){S[d.k]=d.v;save();render()},
 unlockall(){S.all=!S.all;save();render()},
 reset(){if(!UI.rs){UI.rs=true;render();setTimeout(()=>{UI.rs=false;if(UI.tab==='me'&&UI.screen==='home')render()},4000);return}UI.rs=false;S={xp:0,streak:0,last:'',u:{},known:{},miss:{},lang:S.lang,lvl:S.lvl,all:false,ts:0,packs:S.packs,dlg:{},tr:S.tr};save();render();toast('Progress erased')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f)f(el.dataset,el,e)});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='fi'){e.preventDefault();ACT.check()}
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='ci'&&window.matchMedia('(hover:hover)').matches){e.preventDefault();sendChat()}
});
render();
</script>
